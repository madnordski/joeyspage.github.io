<!DOCTYPE html>
<html lang="en">
    <head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Today in Velocipede Podcasts</title>
	<style>
         body {
             background-color: #f4f1ea;
             display: flex;
             flex-direction: column;
             justify-content: center;
             align-items: center;
             min-height: 100vh;
             margin: 0;
             font-family: 'Georgia', serif;
         }
         .list-container {
             background: #fff;
             padding: 40px;
             border-radius: 8px;
             box-shadow: 0 4px 15px rgba(0,0,0,0.05);
             text-align: center;
         }
         h2 {
             color: #2c2a29;
             margin-bottom: 30px;
             font-weight: normal;
         }
         .launch-btn {
             background-color: #fcfbfa;
             border: 1px solid #e8e5dd;
             padding: 12px 25px;
             font-size: 1rem;
             color: #3d3a38;
             cursor: pointer;
             border-radius: 4px;
             transition: all 0.2s ease;
             display: block;
             margin: 10px auto;
             width: 200px;
             font-family: 'Georgia', serif;
         }
         .launch-btn:hover {
             background-color: #2c2a29;
             color: #fcfbfa;
             border-color: #2c2a29;
         }
	</style>
    </head>
    <body>

	<div class="list-container">
            <h2>Today In Velocipede Podcasts</h2>
            
            <!-- To add more podcasts, change the file path -->
	    <div style="font-family: 'Georgia', serif; font-size: 0.85rem;">
		<button class="launch-btn"
			onclick="viewAudio('Teaser01.mp3')">Listen to Teaser 1</button>
		<button class="launch-btn"
			onclick="viewAudio('TIV_Episode01audio.mp3');">Listen to Episode 1</button>
		<button class="launch-btn"
			       onclick="viewAudio('TIV_Ep02.mp3');">Listen to Episode 2</button>
		<button class="launch-btn"
			       onclick="viewAudio('TodayInVelocipedeEp03.mp3');">Listen to Episode 3</button>

	    </div>

	<script>
	 function viewAudio(url) {
	     // A small compact width and height just for the standard browser audio bar
	     const width = 720;
	     const height = 210;
	     
	     // Position calculations to center the audio bar on your monitor
	     const left = (window.screen.width / 2) - (width / 2);
	     const top = (window.screen.height / 2) - (height / 2);
	     
	     const windowFeatures = `width=${width},height=${height},left=${left},top=${top},menubar=no,toolbar=no,location=no,status=no,resizable=no,scrollbars=no`;
	     
	     // Open a blank popup window instance
	     window.open("player.html?file=" + encodeURIComponent(url),
			 "_blank",
			 windowFeatures);	     
	 }
	</script>

    </body>
</html>
