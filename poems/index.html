<!DOCTYPE html>
<html lang="en">
    <head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>My Poetry Collection</title>
	<style>
         body {
             background-color: #f4f1ea;
             display: flex;
             flex-direction: column;
             justify-content: center;
             align-items: center;
             min-height: 100vh;
             margin: 0;
             font-family: 'Georgia', serif;
         }
         .list-container {
             background: #fff;
             padding: 40px;
             border-radius: 8px;
             box-shadow: 0 4px 15px rgba(0,0,0,0.05);
             text-align: center;
         }
         h2 {
             color: #2c2a29;
             margin-bottom: 30px;
             font-weight: normal;
         }
         .launch-btn {
             background-color: #fcfbfa;
             border: 1px solid #e8e5dd;
             padding: 12px 25px;
             font-size: 1rem;
             color: #3d3a38;
             cursor: pointer;
             border-radius: 4px;
             transition: all 0.2s ease;
             display: block;
             margin: 10px auto;
             width: 200px;
             font-family: 'Georgia', serif;
         }
         .launch-btn:hover {
             background-color: #2c2a29;
             color: #fcfbfa;
             border-color: #2c2a29;
         }
	</style>
    </head>
    <body>

	<div class="list-container">
            <h2>Poetry Collection</h2>
            
            <!-- To add more poems, just copy a button line and change the file path -->
            <button class="launch-btn" onclick="viewPoem('Absurd7.html')">Absurd 7</button>
            <button class="launch-btn" onclick="viewPoem('AI_Validation.html')">AI Validation</button>
	    <button class="launch-btn" onclick="viewPoem('No_Place.html', 692)">No Place</button>

            <!-- Example of future additions: -->
            <!-- <button class="launch-btn" onclick="viewPoem('another_poem.html')">Another Poem</button> -->
	</div>

	<script>
         function viewPoem(url, winWidth) {
             // Window dimension settings
             const width = winWidth || 640;
             const height = 860;
             
             // Math to keep the popup perfectly centered on the screen
             const left = (window.screen.width / 2) - (width / 2);
             const top = (window.screen.height / 2) - (height / 2);
             
             const windowFeatures = `width=${width},height=${height},left=${left},top=${top},menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=yes`;
             
             // Opens the external file inside the configured popup window
             window.open(url, "_blank", windowFeatures);
         }
	</script>

    </body>
</html>
